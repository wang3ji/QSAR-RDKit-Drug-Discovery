[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-qsar"
version = "0.1.0"
description = "Lab-in-the-loop QSAR for the adenosine A2A receptor: potency models with calibrated uncertainty, and a screening-campaign simulation in which the assay itself is imperfect."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jingjing Wang" }]
keywords = ["qsar", "drug-discovery", "active-learning", "cheminformatics", "adenosine-receptor"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "xgboost>=2.0",
  "rdkit>=2023.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
plots = ["matplotlib>=3.7"]

[project.scripts]
a2a-qsar = "a2a_qsar.cli:main"

[project.urls]
Repository = "https://github.com/wang3ji/QSAR-RDKit-Drug-Discovery"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
